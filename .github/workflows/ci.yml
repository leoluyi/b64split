name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.20.x', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: make ci

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Publish release
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]]
          make release VERSION="$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
